<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Engine TCG Tracker</title>
<!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Echo Engine">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        voiddark: '#0b0f19',
                        voidpanel: '#131b2e',
                        voidcard: '#1a2642',
                        cyanaccent: '#06b6d4',
                        purpleaccent: '#8b5cf6',
                        crimsonaccent: '#f43f5e'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="min-h-screen bg-voiddark text-slate-100 flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <header class="bg-voidpanel border-b border-slate-800 sticky top-0 z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <!-- Global Board Control Panel -->
            <div class="flex flex-wrap items-center gap-3 bg-voiddark/80 px-4 py-2 rounded-xl border border-slate-800 shadow-inner">
                <!-- Round Counter -->
                <div class="flex items-center space-x-2">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide"><i class="fa-solid fa-rotate mr-1 text-cyan-400"></i>Round:</span>
                    <button onclick="adjustRound(-1)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-bold text-xs flex items-center justify-center">-</button>
                    <span id="global-round" class="text-base font-mono font-bold w-6 text-center text-cyan-400">1</span>
                    <button onclick="adjustRound(1)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-bold text-xs flex items-center justify-center">+</button>
                </div>

                <div class="h-5 w-px bg-slate-800 mx-1"></div>

                <!-- Threat Level Tracker (1-5) -->
                <div class="flex items-center space-x-2">
                    <span class="text-xs font-semibold text-rose-400 uppercase tracking-wide"><i class="fa-solid fa-skull mr-1"></i>Threat:</span>
                    <button onclick="adjustThreat(-1)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-bold text-xs flex items-center justify-center">-</button>
                    <span id="global-threat" class="text-base font-mono font-bold w-5 text-center text-rose-400">1</span>
                    <button onclick="adjustThreat(1)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-bold text-xs flex items-center justify-center">+</button>
                </div>

                <div class="h-5 w-px bg-slate-800 mx-1"></div>

                <!-- Reset All Energy Button -->
                <button onclick="resetAllEnergies()" class="px-3 py-1.5 bg-cyan-950/60 hover:bg-cyan-900/60 border border-cyan-800/50 text-cyan-300 text-xs font-medium rounded-lg transition shadow-sm flex items-center space-x-1.5">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Reset Energy</span>
                </button>

                <!-- Reset All State -->
                <button onclick="openResetModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Reset All</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-3">
        
        <!-- Controls Bar for Player Count & Phase Tracker -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-3 bg-voidpanel p-4 rounded-2xl border border-slate-800 shadow-lg">
            <!-- Player Count Controller (1-4) -->
            <div class="flex items-center space-x-3">
                <label class="text-sm font-medium text-slate-300"><i class="fa-solid fa-users mr-2 text-cyan-400"></i>Active Explorers (1-4):</label>
                <div class="inline-flex rounded-xl bg-voiddark p-1 border border-slate-800">
                    <button onclick="setPlayerCount(1)" id="btn-count-1" class="px-3 py-1.5 text-xs font-bold rounded-lg transition">1</button>
                    <button onclick="setPlayerCount(2)" id="btn-count-2" class="px-3 py-1.5 text-xs font-bold rounded-lg transition">2</button>
                    <button onclick="setPlayerCount(3)" id="btn-count-3" class="px-3 py-1.5 text-xs font-bold rounded-lg transition">3</button>
                    <button onclick="setPlayerCount(4)" id="btn-count-4" class="px-3 py-1.5 text-xs font-bold rounded-lg transition">4</button>
                </div>
            </div>

            <!-- Phase Tracker Bar (Strictly: Draw, Energy, Main, Environment, Loom) -->
            <div class="flex items-center space-x-2 bg-voiddark px-4 py-2 rounded-xl border border-slate-800 shadow-inner overflow-x-auto max-w-full">
                <span class="text-xs font-semibold text-purple-400 uppercase tracking-wide mr-1"><i class="fa-solid fa-list-check mr-1"></i>Phase:</span>
                <div id="phase-pills-container" class="flex items-center space-x-1.5">
                    <!-- Injected dynamically via JS -->
                </div>
            </div>
        </div>

        <!-- Players Grid Container -->
        <div id="players-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <!-- Dynamic player cards will be injected here -->
        </div>

    </main>

    <footer class="bg-voidpanel border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        <p>Echo Engine Companion Tracker • Built for Physical TCG & Campaign Runs • All Rights Reserved</p>
    </footer>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Confirmation Modal -->
    <div id="reset-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-voidpanel border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-100 mb-2">Reset Session Data?</h3>
            <p class="text-sm text-slate-400 mb-6">This will reset all explorer stability, energy, shield, command, scrap, runes counters, threat level, round number, and statuses back to default settings.</p>
            <div class="flex justify-end space-x-3">
                <button onclick="closeResetModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-xl transition">Cancel</button>
                <button onclick="confirmReset()" class="px-4 py-2 bg-crimsonaccent hover:bg-rose-600 text-white text-sm font-medium rounded-xl shadow-lg shadow-rose-900/30 transition">Confirm Reset</button>
            </div>
        </div>
    </div>

    <script>
        // Faction Data Definitions with Exact Starting Stats
        const FACTIONS = {
            'guild': { name: 'Guild of Scrap', color: 'border-amber-500/50 bg-amber-950/10', stability: 22, energy: 4 },
            'scribes': { name: 'Void Scribes', color: 'border-cyan-500/50 bg-cyan-950/10', stability: 16, energy: 5 },
            'apex': { name: 'Apex Syndicate', color: 'border-purple-500/50 bg-purple-950/10', stability: 22, energy: 4 },
            'nullseekers': { name: 'Null Seekers', color: 'border-emerald-500/50 bg-emerald-950/10', stability: 20, energy: 5 }
        };

        // Status Conditions: Shock, Bleed, Burn, Stasis, Corrode
        const STATUS_TYPES = [
            { id: 'shock', label: 'Shock', icon: 'fa-bolt text-yellow-400' },
            { id: 'bleed', label: 'Bleed', icon: 'fa-droplet text-rose-500' },
            { id: 'burn', label: 'Burn', icon: 'fa-fire text-orange-500' },
            { id: 'stasis', label: 'Stasis', icon: 'fa-snowflake text-cyan-400' },
            { id: 'corrode', label: 'Corrode', icon: 'fa-radiation text-emerald-400' }
        ];

        // Strict Turn Phases: Draw, Energy, Main, Environment, Loom
        const PHASES = ['Draw', 'Energy', 'Main', 'Environment', 'Loom'];

        // Global Game State
        let gameState = {
            playerCount: 2,
            round: 1,
            threatLevel: 1,
            currentPhaseIndex: 0,
            priorityIndex: 0,
            players: [
                { id: 0, name: 'Explorer One', faction: 'guild', stability: 22, energy: 4, shield: 0, command: 0, scrap: 0, runes: 0, statuses: [] },
                { id: 1, name: 'Explorer Two', faction: 'scribes', stability: 16, energy: 5, shield: 0, command: 0, scrap: 0, runes: 0, statuses: [] },
                { id: 2, name: 'Explorer Three', faction: 'apex', stability: 22, energy: 4, shield: 0, command: 0, scrap: 0, runes: 0, statuses: [] },
                { id: 3, name: 'Explorer Four', faction: 'nullseekers', stability: 20, energy: 5, shield: 0, command: 0, scrap: 0, runes: 0, statuses: [] }
            ]
        };

        // Load saved state if available in localStorage
        function loadState() {
            const saved = localStorage.getItem('echo_engine_tcg_state_v4');
            if (saved) {
                try {
                    gameState = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse saved state', e);
                }
            }
        }

        function saveState() {
            localStorage.setItem('echo_engine_tcg_state_v4', JSON.stringify(gameState));
        }

        // Initialize App on Window Load
        window.onload = function() {
            loadState();
            renderApp();
		// Register Service Worker for PWA Offline & Install Support
    		if ('serviceWorker' in navigator) {
        		window.addEventListener('load', () => {
            		navigator.serviceWorker.register('./sw.js')
                		.then((reg) => console.log('ServiceWorker registration successful:', reg.scope))
                		.catch((err) => console.log('ServiceWorker registration failed:', err));
        		});
    		}
        };

        // Player Count Controller
        function setPlayerCount(count) {
            gameState.playerCount = count;
            if (gameState.priorityIndex >= count) {
                gameState.priorityIndex = 0;
            }
            saveState();
            renderApp();
            showToast(`Active explorers set to ${count}`, 'info');
        }

        // Round Counter
        function adjustRound(amount) {
            gameState.round = Math.max(1, gameState.round + amount);
            saveState();
            document.getElementById('global-round').innerText = gameState.round;
        }

        // Threat Level Adjuster (1-5)
        function adjustThreat(amount) {
            gameState.threatLevel = Math.max(1, Math.min(5, gameState.threatLevel + amount));
            saveState();
            document.getElementById('global-threat').innerText = gameState.threatLevel;
            showToast(`Loom Threat Level set to ${gameState.threatLevel}`, 'warning');
        }

        // Phase Changer
        function setPhase(index) {
            gameState.currentPhaseIndex = index;
            saveState();
            renderPhases();
            showToast(`Phase: ${PHASES[index]}`, 'info');
        }

        // Set Priority Directly (Instantaneous switch without altering stats)
        function setPriority(index) {
            gameState.priorityIndex = index;
            saveState();
            renderApp();
            showToast(`Priority granted to ${gameState.players[index].name}`, 'info');
        }

        // Reset All Energy to faction defaults
        function resetAllEnergies() {
            gameState.players.slice(0, gameState.playerCount).forEach(p => {
                p.energy = FACTIONS[p.faction].energy;
            });
            saveState();
            renderApp();
            showToast('All explorer energy pools refreshed for the new round!', 'success');
        }

        // Modal Controls
        function openResetModal() {
            document.getElementById('reset-modal').classList.remove('hidden');
        }

        function closeResetModal() {
            document.getElementById('reset-modal').classList.add('hidden');
        }

        function confirmReset() {
            localStorage.removeItem('echo_engine_tcg_state_v4');
            location.reload();
        }

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = 'bg-slate-800 border-slate-700 text-slate-200';
            if (type === 'success') bgClass = 'bg-cyan-950/90 border-cyan-800 text-cyan-300';
            if (type === 'warning') bgClass = 'bg-amber-950/90 border-amber-800 text-amber-300';
            
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-xl text-xs font-medium flex items-center space-x-2 transition-all transform translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Player Property Updaters
        function updatePlayerName(id, val) {
            gameState.players[id].name = val;
            saveState();
        }

        function updatePlayerFaction(id, factionKey) {
            const p = gameState.players[id];
            p.faction = factionKey;
            p.stability = FACTIONS[factionKey].stability;
            p.energy = FACTIONS[factionKey].energy;
            saveState();
            renderApp();
        }

        function adjustPlayerStat(id, stat, delta) {
            const p = gameState.players[id];
            if (stat === 'stability') {
                p.stability = Math.max(0, p.stability + delta);
            } else if (stat === 'energy') {
                p.energy = Math.max(0, p.energy + delta);
            } else if (stat === 'shield') {
                p.shield = Math.max(0, p.shield + delta);
            } else if (stat === 'command') {
                p.command = Math.max(0, p.command + delta);
            } else if (stat === 'scrap') {
                p.scrap = Math.max(0, p.scrap + delta);
            } else if (stat === 'runes') {
                p.runes = Math.max(0, p.runes + delta);
            }
            saveState();
            renderApp();
        }

        // Command Counter Quick Actions
        function applyCommandAction(id, type) {
            const p = gameState.players[id];
            if (type === 'inc1') {
                p.command += 1;
                showToast(`${p.name} gained +1 Command Counter`, 'info');
            } else if (type === 'dec2') {
                if (p.command >= 2) {
                    p.command -= 2;
                    showToast(`${p.name} spent 2 Command Counters for tactical ability!`, 'success');
                } else {
                    showToast(`Not enough Command Counters (Need 2)`, 'warning');
                    return;
                }
            } else if (type === 'dec6') {
                if (p.command >= 6) {
                    p.command -= 6;
                    showToast(`${p.name} unleashed Ultimate Command Ability! (-6 Counters)`, 'success');
                } else {
                    showToast(`Not enough Command Counters (Need 6)`, 'warning');
                    return;
                }
            }
            saveState();
            renderApp();
        }

        // Status Toggle
        function toggleStatus(id, statusId) {
            const p = gameState.players[id];
            const index = p.statuses.indexOf(statusId);
            if (index > -1) {
                p.statuses.splice(index, 1);
            } else {
                p.statuses.push(statusId);
            }
            saveState();
            renderApp();
        }

        // Render Phase pills
        function renderPhases() {
            const container = document.getElementById('phase-pills-container');
            container.innerHTML = '';
            PHASES.forEach((phase, index) => {
                const isActive = (index === gameState.currentPhaseIndex);
                const pill = document.createElement('button');
                pill.onclick = () => setPhase(index);
                pill.className = `px-2.5 py-1 text-xs font-semibold rounded-lg transition ${isActive ? 'bg-purple-600 text-white shadow-md shadow-purple-900/40' : 'bg-voiddark hover:bg-slate-800 text-slate-400'}`;
                pill.innerText = phase;
                container.appendChild(pill);
            });
        }

        // Full Render Engine
        function renderApp() {
            // Render Player Count Buttons Active State
            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById(`btn-count-${i}`);
                if (btn) {
                    if (i === gameState.playerCount) {
                        btn.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-cyan-600 text-white shadow";
                    } else {
                        btn.className = "px-3 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-slate-200 transition";
                    }
                }
            }

            // Render Globals
            const roundElem = document.getElementById('global-round');
            if (roundElem) roundElem.innerText = gameState.round;

            const threatElem = document.getElementById('global-threat');
            if (threatElem) threatElem.innerText = gameState.threatLevel;

            renderPhases();

            // Render Players Grid
            const grid = document.getElementById('players-grid');
            grid.innerHTML = '';

            for (let i = 0; i < gameState.playerCount; i++) {
                const p = gameState.players[i];
                const factionData = FACTIONS[p.faction] || FACTIONS['guild'];
                const isPriority = (i === gameState.priorityIndex);

                const cardHtml = document.createElement('div');
                cardHtml.className = `bg-voidpanel rounded-2xl border ${isPriority ? 'border-purple-500 shadow-purple-950/50 shadow-2xl ring-2 ring-purple-500/40' : factionData.color} p-5 shadow-xl relative overflow-hidden transition-all`;
                
                cardHtml.innerHTML = `
                    ${isPriority ? '<div class="absolute top-0 right-0 bg-purple-600 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl uppercase tracking-wider shadow"><i class="fa-solid fa-crown mr-1"></i>Priority Turn</div>' : ''}
                    
                    <!-- Player Header, Priority Button & Faction Selector -->
                    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div class="flex items-center space-x-3 flex-grow">
                            <!-- Priority Button Indicator -->
                            <button onclick="setPriority(${i})" title="Click to grant priority" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl border text-xs font-bold transition ${isPriority ? 'bg-purple-950 border-purple-500 text-purple-300 shadow' : 'bg-voiddark border-slate-700 text-slate-400 hover:text-slate-200'}">
                                <i class="fa-solid ${isPriority ? 'fa-circle-dot text-purple-400' : 'fa-circle text-slate-600'}"></i>
                                <span>Priority</span>
                            </button>
                            <input type="text" value="${p.name}" onchange="updatePlayerName(${i}, this.value)" class="bg-voiddark border border-slate-700 rounded-xl px-3 py-1.5 text-sm font-bold text-slate-100 focus:outline-none focus:border-cyan-500 w-full sm:w-36">
                        </div>
                        <div class="flex items-center space-x-2">
                            <select onchange="updatePlayerFaction(${i}, this.value)" class="bg-voiddark border border-slate-700 rounded-xl px-3 py-1.5 text-xs font-medium text-slate-300 focus:outline-none focus:border-cyan-500">
                                <option value="guild" ${p.faction === 'guild' ? 'selected' : ''}>Guild of Scrap</option>
                                <option value="scribes" ${p.faction === 'scribes' ? 'selected' : ''}>Void Scribes</option>
                                <option value="apex" ${p.faction === 'apex' ? 'selected' : ''}>Apex Syndicate</option>
                                <option value="nullseekers" ${p.faction === 'nullseekers' ? 'selected' : ''}>Null Seekers</option>
                            </select>
                        </div>
                    </div>

                    <!-- Core Trackers Grid (Stability, Energy, Shield, Command, Scrap, Runes) -->
                    <div class="grid grid-cols-2 sm:grid-cols-6 gap-3 mb-4">
                        <!-- Stability Tracker (Core Health Pool) -->
                        <div class="bg-voiddark/60 p-3 rounded-xl border border-slate-800/80 flex flex-col justify-between">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[11px] font-semibold text-rose-400 uppercase tracking-wider"><i class="fa-solid fa-heart mr-1"></i>Stability</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <button onclick="adjustPlayerStat(${i}, 'stability', -1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">-</button>
                                <span class="text-xl font-mono font-bold text-rose-400">${p.stability}</span>
                                <button onclick="adjustPlayerStat(${i}, 'stability', 1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">+</button>
                            </div>
                        </div>

                        <!-- Energy Tracker -->
                        <div class="bg-voiddark/60 p-3 rounded-xl border border-slate-800/80 flex flex-col justify-between">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[11px] font-semibold text-cyan-400 uppercase tracking-wider"><i class="fa-solid fa-bolt mr-1"></i>Energy</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <button onclick="adjustPlayerStat(${i}, 'energy', -1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">-</button>
                                <span class="text-xl font-mono font-bold text-cyan-400">${p.energy}</span>
                                <button onclick="adjustPlayerStat(${i}, 'energy', 1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">+</button>
                            </div>
                        </div>

                        <!-- Shield Tracker -->
                        <div class="bg-voiddark/60 p-3 rounded-xl border border-slate-800/80 flex flex-col justify-between">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[11px] font-semibold text-blue-400 uppercase tracking-wider"><i class="fa-solid fa-shield mr-1"></i>Shield</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <button onclick="adjustPlayerStat(${i}, 'shield', -1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">-</button>
                                <span class="text-xl font-mono font-bold text-blue-400">${p.shield}</span>
                                <button onclick="adjustPlayerStat(${i}, 'shield', 1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">+</button>
                            </div>
                        </div>

                        <!-- Command Counter Tracker -->
                        <div class="bg-voiddark/60 p-3 rounded-xl border border-slate-800/80 flex flex-col justify-between">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[11px] font-semibold text-purple-400 uppercase tracking-wider"><i class="fa-solid fa-terminal mr-1"></i>Command</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <button onclick="adjustPlayerStat(${i}, 'command', -1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">-</button>
                                <span class="text-xl font-mono font-bold text-purple-400">${p.command}</span>
                                <button onclick="adjustPlayerStat(${i}, 'command', 1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">+</button>
                            </div>
                        </div>

                        <!-- Scrap Counter (Defaults to 0) -->
                        <div class="bg-voiddark/60 p-3 rounded-xl border border-slate-800/80 flex flex-col justify-between">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[11px] font-semibold text-amber-500 uppercase tracking-wider"><i class="fa-solid fa-gears mr-1"></i>Scrap</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <button onclick="adjustPlayerStat(${i}, 'scrap', -1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">-</button>
                                <span class="text-xl font-mono font-bold text-amber-500">${p.scrap}</span>
                                <button onclick="adjustPlayerStat(${i}, 'scrap', 1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">+</button>
                            </div>
                        </div>

                        <!-- Runes Counter (Defaults to 0) -->
                        <div class="bg-voiddark/60 p-3 rounded-xl border border-slate-800/80 flex flex-col justify-between">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[11px] font-semibold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-gem mr-1"></i>Runes</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <button onclick="adjustPlayerStat(${i}, 'runes', -1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">-</button>
                                <span class="text-xl font-mono font-bold text-emerald-400">${p.runes}</span>
                                <button onclick="adjustPlayerStat(${i}, 'runes', 1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 font-bold transition flex items-center justify-center">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- Command Action Rules Bar -->
                    <div class="bg-voiddark/80 p-3 rounded-xl border border-slate-800 mb-4 flex flex-wrap items-center justify-between gap-2">
                        <span class="text-xs text-slate-400 font-medium">Command Abilities:</span>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="applyCommandAction(${i}, 'inc1')" class="px-2.5 py-1 bg-purple-950/60 hover:bg-purple-900/60 border border-purple-800/50 text-purple-300 text-xs rounded-lg transition">
                                <i class="fa-solid fa-plus mr-1"></i>Gain (+1)
                            </button>
                            <button onclick="applyCommandAction(${i}, 'dec2')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg transition">
                                Spend 2 Counters
                            </button>
                            <button onclick="applyCommandAction(${i}, 'dec6')" class="px-2.5 py-1 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-lg shadow transition">
                                Ultimate (-6)
                            </button>
                        </div>
                    </div>

                    <!-- Status Conditions Checkboxes & Toggles (Shock, Bleed, Burn, Stasis, Corrode) -->
                    <div>
                        <span class="text-[11px] text-slate-400 uppercase tracking-wide block mb-2">Status Conditions:</span>
                        <div class="flex flex-wrap gap-1.5">
                            ${STATUS_TYPES.map(status => {
                                const active = p.statuses.includes(status.id);
                                return `
                                    <button onclick="toggleStatus(${i}, '${status.id}')" class="px-2.5 py-1 rounded-lg text-xs font-medium border transition flex items-center space-x-1.5 ${active ? 'bg-cyan-950/80 border-cyan-700 text-cyan-200 shadow-sm' : 'bg-voiddark/40 border-slate-800 text-slate-500 hover:text-slate-300'}">
                                        <i class="fa-solid ${status.icon}"></i>
                                        <span>${status.label}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;

                grid.appendChild(cardHtml);
            }
        }
    </script>

</body>
</html>
